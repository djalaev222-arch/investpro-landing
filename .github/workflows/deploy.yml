name: Deploy to Netlify

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify deploy
        run: |
          curl -s -X POST "https://api.netlify.com/build_hooks/6a29815b0269167ecff7be52"
          echo "Deploy triggered → https://investpro-landing.netlify.app"
